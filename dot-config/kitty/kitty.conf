# map --allow-fallback=shifted,ascii alt+p>d kitten choose-files --mode=dir

#::  Select a directory using the choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/> kitten
#::  and insert it into the terminal.

#: Insert selected line

# map --allow-fallback=shifted,ascii alt+p>l kitten hints --type line --program -

#::  Select a line of text and insert it into the terminal. Useful for
#::  the output of things like: `ls -1`.

#: Insert selected word

# map --allow-fallback=shifted,ascii alt+p>w kitten hints --type word --program -

#::  Select words and insert into terminal.

