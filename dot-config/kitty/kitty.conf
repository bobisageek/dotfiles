#: Tab management {{{
geninclude bin/goto_tab_nums.py

map alt+left kitten bin/focus_window_or_tab.py left
map alt+h kitten bin/focus_window_or_tab.py left

map alt+right kitten bin/focus_window_or_tab.py right
map alt+l kitten bin/focus_window_or_tab.py right

#: Close OS window

# map --allow-fallback=shifted,ascii shift+cmd+w close_os_window

#: Move tab forward

# map alt+. move_tab_forward

#: Move tab backward

# map alt+, move_tab_backward

#: Set tab title

#: You can also create shortcuts to go to specific tabs, with 1 being
#: the first tab, 2 the second tab and -1 being the previously active
#: tab, -2 being the tab active before the previously active tab and
#: so on. Any number larger than the number of tabs goes to the last
#: tab and any number less than the number of previously used tabs in
#: the history goes to the oldest previously used tab in the history::

#:     map ctrl+alt+1 goto_tab 1
#:     map ctrl+alt+2 goto_tab 2

#: Just as with new_window above, you can also pass the name of
#: arbitrary commands to run when using new_tab and new_tab_with_cwd.
#: Finally, if you want the new tab to open next to the current tab
#: rather than at the end of the tabs list, use::

#:     map ctrl+t new_tab !neighbor [optional cmd to run]
#: }}}

#: Layout management {{{

#: Next layout

# map --allow-fallback=shifted,ascii alt+l next_layout


#: You can also create shortcuts to switch to specific layouts::

#:     map ctrl+alt+t goto_layout tall
#:     map ctrl+alt+s goto_layout stack

#: Similarly, to switch back to the previous layout::

#:     map ctrl+alt+p last_used_layout

#: There is also a toggle_layout action that switches to the named
#: layout or back to the previous layout if in the named layout.
#: Useful to temporarily "zoom" the active window by switching to the
#: stack layout::

#:     map ctrl+alt+z toggle_layout stack
#: }}}

#: Font sizes {{{

#: You can change the font size for all top-level kitty OS windows at
#: a time or only the current one.

#: Increase font size

map kitty_mod+equal  change_font_size all +2.0
map kitty_mod+plus   change_font_size all +2.0
map kitty_mod+kp_add change_font_size all +2.0

#: Decrease font size

map kitty_mod+minus       change_font_size all -2.0
map kitty_mod+kp_subtract change_font_size all -2.0
map cmd+minus             change_font_size all -2.0
map shift+cmd+minus       change_font_size all -2.0

#: Reset font size

map kitty_mod+0 change_font_size all 0


#: To setup shortcuts for specific font sizes::

#:     map alt+f6 change_font_size all 10.0

#: To setup shortcuts to change only the current OS window's font
#: size::

#:     map alt+f6 change_font_size current 10.0

#: To setup shortcuts to multiply/divide the font size::

#:     map alt+f6 change_font_size all *2.0
#:     map alt+f6 change_font_size all /2.0
#: }}}

#: Select and act on visible text {{{

#: Use the hints kitten to select text and either pass it to an
#: external program or insert it into the terminal or copy it to the
#: clipboard.

#: Open URL

# map --allow-fallback=shifted,ascii alt+e open_url_with_hints

#::  Open a currently visible URL using the keyboard. The program used
#::  to open the URL is specified in open_url_with.

#: Insert selected path

# map --allow-fallback=shifted,ascii alt+p>f kitten hints --type path --program -

#::  Select a path/filename and insert it into the terminal. Useful,
#::  for instance to run git commands on a filename output from a
#::  previous git command.

#: Open selected path

# map --allow-fallback=shifted,ascii alt+p>shift+f kitten hints --type path

#::  Select a path/filename and open it with the default open program.

#: Insert chosen file

# map --allow-fallback=shifted,ascii alt+p>c kitten choose-files

#::  Select a file using the choose-files
