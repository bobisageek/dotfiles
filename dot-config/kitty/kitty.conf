# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family      family="JetBrainsMono Nerd Font Mono"
font_size        13.0
bold_font        family='JetBrainsMono Nerd Font Mono' style=Bold
italic_font      auto
bold_italic_font family='JetBrainsMono Nerd Font Mono' style='Bold Italic'

#: }}}

#: Scrollback {{{

scrollbar_width 0.3

scrollbar_radius 0.2

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

#: }}}

#: Mouse {{{

mouse_hide_wait -1.0

paste_actions confirm,confirm-if-large

strip_trailing_spaces smart

#: Mouse actions {{{

mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#::  Same as above, except that the action is performed even when the
#::  mouse is grabbed by the program running in the terminal.

#: Click the link under the mouse cursor

mouse_map kitty_mod+shift+left release grabbed,ungrabbed mouse_handle_click link

#::  Variant with Ctrl+Shift is present because the simple click based
#::  version has an unavoidable delay of click_interval, to
#::  disambiguate clicks from double clicks.

#: Discard press event for link click

mouse_map kitty_mod+shift+left press grabbed discard_event

#::  Prevent this press event from being sent to the program that has
#::  grabbed the mouse, as the corresponding release event is used to
#::  open a URL.

mouse_map alt+left press ungrabbed mouse_selection rectangle

mouse_map alt+left doublepress ungrabbed mouse_selection line_from_begin

mouse_map left doublepress ungrabbed mouse_selection word

mouse_map kitty_mod+alt+left doublepress ungrabbed mouse_selection word_and_line_from_point

mouse_map kitty_mod+shift+right press ungrabbed mouse_show_command_output

#: }}}

#: }}}

#: Terminal bell {{{

visual_bell_duration 0.5 ease-in-out linear

visual_bell_color #09043d

#: }}}

#: Window layout {{{

enabled_layouts splits:split_axis=auto

window_border_width 0.25pt

window_padding_width 0.5

active_border_color #00ff00

inactive_border_color #aaaaaa

inactive_text_alpha 0.2

hide_window_decorations yes

#: }}}

#: Tab bar {{{

tab_bar_edge top

tab_bar_style powerline

tab_bar_min_tabs 0

tab_powerline_style slanted

tab_activity_symbol "*"

tab_title_max_length 0

tab_title_template '{index}:{title}'

active_tab_title_template '{"**Mode: " + keyboard_mode + "**" if keyboard_mode else (str(index) + ":" + title)}'

active_tab_foreground   #ddd
active_tab_background   #00d
active_tab_font_style   bold
inactive_tab_foreground #aaa
inactive_tab_background #333
inactive_tab_font_style italic

#: }}}

#: Color scheme {{{

# foreground #dddddd
# background #000000

background_opacity 0.8

background_blur 1

dynamic_background_opacity yes

# background_image none

# background_image_layout tiled

# selection_foreground #000000
# selection_background #fffacd

palette_generate semantic

#: The color table {{{

#: The 256 terminal colors. There are 8 basic colors, each color has a
#: dull and bright version, for the first 16 colors. You can set the
#: remaining 240 colors as color16 to color255.

# color0 #000000
# color8 #767676

#: black

# color1 #cc0403
# color9 #f2201f

#: red

# color2  #19cb00
# color10 #23fd00

#: green

# color3  #cecb00
# color11 #fffd00

#: yellow

# color4  #0d73cc
# color12 #1a8fff

#: blue

# color5  #cb1ed1
# color13 #fd28ff

#: magenta

# color6  #0dcdcd
# color14 #14ffff

#: cyan

# color7  #dddddd
# color15 #ffffff

#: white

# mark1_foreground black

#: Color for marks of type 1

# mark1_background #98d3cb

#: Color for marks of type 1 (light steel blue)

# mark2_foreground black

#: Color for marks of type 2

# mark2_background #f2dcd3

#: Color for marks of type 2 (beige)

# mark3_foreground black

#: Color for marks of type 3

# mark3_background #f274bc

#: Color for marks of type 3 (violet)

#: }}}

#: }}}

#: Advanced {{{

shell nu -l

allow_remote_control yes

listen_on unix:/tmp/kittysocket

# watcher

exe_search_path bin
#:     exe_search_path /some/prepended/path
#:     exe_search_path +/some/appended/path
#:     exe_search_path -/some/excluded/path

# startup_session none

#: Path to a session file to use for all kitty instances. Can be
#: overridden by using the kitty --session =none command line option
#: for individual instances. See sessions
#: <https://sw.kovidgoyal.net/kitty/sessions/> in the kitty
#: documentation for details. Note that relative paths are interpreted
#: with respect to the kitty config directory. Environment variables
#: in the path are expanded. Changing this option by reloading the
#: config is not supported. Note that if kitty is invoked with command
#: line arguments specifying a command to run, this option is ignored.

#: }}}

#: OS specific tweaks {{{

macos_option_as_alt yes

macos_quit_when_last_window_closed yes

#: }}}

#: Keyboard shortcuts {{{

# kitty_mod is ctrl on linux, the globinclude at the end of the file will override it to cmd (which is sent by the physical ctrl key) on macos
kitty_mod ctrl

# wipe all the default shortcuts
clear_all_shortcuts yes

#: load maps from running this script, which tries to map cmd to ctrl on macos
geninclude bin/remap_cmd_ctrl.py

map alt+/ select_tab
map alt+t new_tab_with_cwd

map kitty_mod+alt+escape pop_keyboard_mode

map --new-mode manage --on-action end alt+space
map --mode manage esc pop_keyboard_mode
map --new-mode tab --on-action end --mode manage t
map --mode tab esc pop_keyboard_mode
map --mode tab r set_tab_title
# map --mode manage r start_resizing_window

# map_timeout 0.0

action_alias olay kitten panel -o tab_bar_min_tabs=2 --lines=50 --columns=140 --edge=center-sized --focus-policy=on-demand --layer=top

#: Clipboard {{{

#: Copy to clipboard

map --allow-fallback=shifted,ascii kitty_mod+shift+c copy_to_clipboard

#::  There is also a copy_or_interrupt action that can be optionally
#::  mapped to Ctrl+C. It will copy only if there is a selection and
#::  send an interrupt otherwise. Similarly,
#::  copy_and_clear_or_interrupt will copy and clear the selection or
#::  send an interrupt if there is no selection. The copy_or_noop
#::  action will copy if there is a selection and pass the key through
#::  to the application running in the terminal if there is no
#::  selection.

#: Copy to clipboard or pass through

map --allow-fallback=shifted,ascii kitty_mod+c copy_or_interrupt

#: Paste from clipboard

map --allow-fallback=shifted,ascii kitty_mod+shift+v paste_from_clipboard
map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard

#: Paste from selection

# map --allow-fallback=shifted,ascii alt+s paste_from_selection
# map shift+insert                   paste_from_selection

#: Pass selection to program

# map --allow-fallback=shifted,ascii alt+o pass_selection_to_program

#::  You can also pass the contents of the current selection to any
#::  program with pass_selection_to_program. By default, the system's
#::  open program is used, but you can specify your own, the selection
#::  will be passed as a command line argument to the program. For
#::  example::

#::      map alt+o pass_selection_to_program firefox

#::  You can pass the current selection to a terminal program running
#::  in a new kitty window, by using the @selection placeholder::

#::      map alt+y new_window less @selection

#: }}}

#: Scrolling {{{

map --new-mode scroll --mode manage s
map --new-mode scroll alt+s
map --mode scroll esc combine : pop_keyboard_mode : scroll_end
map --mode scroll enter combine : pop_keyboard_mode : scroll_end
map --mode scroll up scroll_line_up smooth
map --mode scroll down scroll_line_down smooth
map --mode scroll k scroll_line_up smooth
map --mode scroll j scroll_line_down smooth
map --mode scroll shift+up scroll_to_prompt -1
map --mode scroll shift+down scroll_to_prompt 1
map --mode scroll page_up scroll_page_up
map --mode scroll page_down scroll_page_down
map --mode scroll home scroll_home
map --mode scroll end scroll_end
map --mode scroll / combine : pop_keyboard_mode : search_scrollback
map --mode scroll shift+e combine : pop_keyboard_mode : show_scrollback
map --mode scroll e combine : pop_keyboard_mode : show_last_non_empty_command_output

#: Scroll line up

# map alt+up                   scroll_line_up smooth
# map --allow-fallback=shifted,ascii alt+k scroll_line_up smooth
# map opt+cmd+page_up                scroll_line_up smooth
# map cmd+up                         scroll_line_up smooth

#: Scroll line down

# map alt+down                 scroll_line_down smooth
# map --allow-fallback=shifted,ascii alt+j scroll_line_down smooth
# map opt+cmd+page_down              scroll_line_down smooth
# map cmd+down                       scroll_line_down smooth

#: Scroll page up

# map alt+page_up scroll_page_up
# map cmd+page_up       scroll_page_up

#: Scroll page down

# map alt+page_down scroll_page_down
# map cmd+page_down       scroll_page_down

#: Scroll to top

# map alt+home scroll_home
# map cmd+home       scroll_home

#: Scroll to bottom

# map alt+end scroll_end
# map cmd+end       scroll_end

#: Scroll to previous shell prompt

# map --allow-fallback=shifted,ascii alt+z scroll_to_prompt -1

#::  Use a parameter of 0 for scroll_to_prompt to scroll to the last
#::  jumped to or the last clicked position. Requires shell
#::  integration <https://sw.kovidgoyal.net/kitty/shell-integration/>
#::  to work.

#: Scroll to next shell prompt

# map --allow-fallback=shifted,ascii alt+x scroll_to_prompt 1

#: Browse scrollback buffer in pager

# map --allow-fallback=shifted,ascii alt+h show_scrollback

#::  You can pipe the contents of the current screen and history
#::  buffer as STDIN to an arbitrary program using launch --stdin-
#::  source. For example, the following opens the scrollback buffer in
#::  less in an overlay window::

#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

#::  For more details on piping screen and buffer contents to external
#::  programs, see launch <https://sw.kovidgoyal.net/kitty/launch/>.

#: Browse output of the last shell command in pager

# map --allow-fallback=shifted,ascii alt+g show_last_command_output

#::  You can also define additional shortcuts to get the command
#::  output. For example, to get the first command output on screen::

#::      map f1 show_first_command_output_on_screen

#::  To get the command output that was last accessed by a keyboard
#::  action or mouse action::

#::      map f1 show_last_visited_command_output

#::  You can pipe the output of the last command run in the shell
#::  using the launch action. For example, the following opens the
#::  output in less in an overlay window::

#::      map f1 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

#::  To get the output of the first command on the screen, use
#::  @first_cmd_output_on_screen. To get the output of the last jumped
#::  to command, use @last_visited_cmd_output.

#::  Requires shell integration
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> to work.

#: Search the scrollback within a pager

# map alt+/                    search_scrollback
# map --allow-fallback=shifted,ascii cmd+f search_scrollback

#::  Search for currently selected text in the scrollback using the
#::  configured scrollback_pager. Assumes that pressing the / key
#::  triggers search mode in the pager. If you want to create a manual
#::  mapping with a special pager for this, you can use something
#::  like:

#::      map f1 combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay mypager : send_key /

#::  For more sophisticated control, such as using the current
#::  selection, use remote_control_script.

#: }}}

#: Window management {{{

map alt+n new_window_with_cwd

map alt+. focus_visible_window

#::  For more details, see launch
